name: refresh stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/make_stats.py
      - assets/pixelfont.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate stats.svg
        working-directory: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python make_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "stats.svg unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp assets/stats.svg "$RUNNER_TEMP/stats.svg"
          for attempt in 1 2 3 4 5; do
            git add assets/stats.svg
            git commit -m "Refresh stats"
            if git push; then
              exit 0
            fi
            echo "push attempt $attempt failed; resyncing with origin/main"
            sleep $((attempt * 5))
            git fetch origin main
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/stats.svg" assets/stats.svg
            if git diff --quiet -- assets/stats.svg; then
              echo "origin already has these stats"
              exit 0
            fi
          done
          echo "push failed after 5 attempts"
          exit 1
